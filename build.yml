name: Build jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write project files
        run: |
          mkdir -p p/src/main/java/dev/attackvisual p/src/main/resources
          cat > p/build.gradle <<'AV_EOF_END'
          plugins {
          	id 'fabric-loom' version "${loom_version}"
          }

          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }

          repositories {}

          dependencies {
          	minecraft "com.mojang:minecraft:${project.minecraft_version}"
          	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
          	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
          	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }

          processResources {
          	inputs.property "version", project.version
          	filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
          }

          tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
          java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
          AV_EOF_END
          cat > p/settings.gradle <<'AV_EOF_END'
          pluginManagement {
          	repositories {
          		maven { url = 'https://maven.fabricmc.net/' }
          		mavenCentral()
          		gradlePluginPortal()
          	}
          }
          rootProject.name = 'attackvisual'
          AV_EOF_END
          cat > p/gradle.properties <<'AV_EOF_END'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.4
          loader_version=0.18.4
          loom_version=1.14-SNAPSHOT
          fabric_api_version=0.141.1+1.21.11

          mod_version=1.0.0
          maven_group=dev.attackvisual
          archives_base_name=attackvisual
          AV_EOF_END
          cat > p/src/main/resources/fabric.mod.json <<'AV_EOF_END'
          {
            "schemaVersion": 1,
            "id": "attackvisual",
            "version": "${version}",
            "name": "Attack Visual",
            "description": "PvP + PvE visuals with a color theme for the whole interface. Right Shift cycles themes.",
            "authors": ["You"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": { "client": ["dev.attackvisual.AttackVisual"] },
            "depends": {
              "fabricloader": ">=0.18.0",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          AV_EOF_END
          cat > p/src/main/java/dev/attackvisual/AttackHud.java <<'AV_EOF_END'
          package dev.attackvisual;

          import net.fabricmc.fabric.api.client.rendering.v1.hud.HudElement;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.render.RenderTickCounter;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.EquipmentSlot;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.effect.StatusEffectInstance;
          import net.minecraft.item.ItemStack;
          import java.time.LocalTime;
          import java.time.format.DateTimeFormatter;

          public class AttackHud implements HudElement {
          	private static final int PANEL = 0xE0101018;
          	public static final String[] CROSSHAIRS = {"Dot", "Cross", "Circle", "Gap cross"};

          	// ---- drawing helpers: rounded plate with a soft glow outline ----
          	private static void rrect(DrawContext c, int x, int y, int w, int h, int col) {
          		c.fill(x + 2, y, x + w - 2, y + h, col);
          		c.fill(x, y + 2, x + w, y + h - 2, col);
          		c.fill(x + 1, y + 1, x + w - 1, y + h - 1, col);
          	}

          	static void plate(DrawContext c, int x, int y, int w, int h, int accent) {
          		for (int i = 3; i >= 1; i--) rrect(c, x - i, y - i, w + 2 * i, h + 2 * i, Theme.withAlpha(accent, 0x10 * (4 - i)));
          		rrect(c, x - 1, y - 1, w + 2, h + 2, Theme.withAlpha(accent, 0xE0));
          		rrect(c, x, y, w, h, PANEL);
          	}

          	@Override
          	public void render(DrawContext ctx, RenderTickCounter tick) {
          		MinecraftClient mc = MinecraftClient.getInstance();
          		if (mc.player == null || mc.options.hudHidden) return;

          		Theme t = Theme.current();
          		int w = ctx.getScaledWindowWidth();
          		int h = ctx.getScaledWindowHeight();
          		int cx = w / 2, cy = h / 2;

          		if (Config.crosshair) crosshair(ctx, t, cx, cy);

          		if (Config.hitMarker && System.currentTimeMillis() - Effects.hitTime < 200) {
          			for (int i = 3; i <= 6; i++) {
          				ctx.fill(cx + i, cy + i, cx + i + 1, cy + i + 1, 0xFFFFFFFF);
          				ctx.fill(cx - i - 1, cy + i, cx - i, cy + i + 1, 0xFFFFFFFF);
          				ctx.fill(cx + i, cy - i - 1, cx + i + 1, cy - i, 0xFFFFFFFF);
          				ctx.fill(cx - i - 1, cy - i - 1, cx - i, cy - i, 0xFFFFFFFF);
          			}
          		}

          		float hp = Math.max(0f, Math.min(1f, mc.player.getHealth() / mc.player.getMaxHealth()));
          		int x0 = cx - 91, y0 = h - 26;
          		ctx.fill(x0, y0, x0 + 182, y0 + 2, Theme.withAlpha(t.accent, 0x40));
          		ctx.fill(x0, y0, x0 + (int) (182 * hp), y0 + 2, hp > 0.3f ? t.accent : 0xFFFF3B3B);

          		if (Config.watermark) watermark(ctx, mc, t, w, h);
          		if (Config.infoPanel) coords(ctx, mc, t, w, h);
          		if (Config.keystrokes) drawKeys(ctx, mc, t, w, h);
          		if (Config.potions) drawPotions(ctx, mc, t, w, h);
          		if (Config.targetHud) target(ctx, mc, t, w, h);
          		if (Config.armor) drawArmor(ctx, mc, t, w, h);
          	}

          	private void crosshair(DrawContext c, Theme t, int cx, int cy) {
          		int col = t.accent;
          		switch (Config.crosshairStyle) {
          			case 1 -> { c.fill(cx - 5, cy, cx + 6, cy + 1, col); c.fill(cx, cy - 5, cx + 1, cy + 6, col); }
          			case 2 -> {
          				for (int d = 0; d < 360; d += 15) {
          					int x = cx + (int) Math.round(Math.cos(Math.toRadians(d)) * 4);
          					int y = cy + (int) Math.round(Math.sin(Math.toRadians(d)) * 4);
          					c.fill(x, y, x + 1, y + 1, col);
          				}
          			}
          			case 3 -> {
          				c.fill(cx - 6, cy, cx - 2, cy + 1, col); c.fill(cx + 3, cy, cx + 7, cy + 1, col);
          				c.fill(cx, cy - 6, cx + 1, cy - 2, col); c.fill(cx, cy + 3, cx + 1, cy + 7, col);
          			}
          			default -> c.fill(cx - 1, cy - 1, cx + 1, cy + 1, col);
          		}
          	}

          	private void watermark(DrawContext ctx, MinecraftClient mc, Theme t, int sw, int sh) {
          		HudLayout.El el = HudLayout.WATERMARK;
          		int ping = 0;
          		var nh = mc.getNetworkHandler();
          		if (nh != null) {
          			var entry = nh.getPlayerListEntry(mc.player.getUuid());
          			if (entry != null) ping = entry.getLatency();
          		}
          		String name = "Attack Visual";
          		String rest = "  \u2022  " + mc.player.getName().getString()
          			+ "  \u2022  " + mc.getCurrentFps() + " FPS"
          			+ "  \u2022  " + ping + " ms"
          			+ "  \u2022  " + String.format("%.1f", Effects.bps) + " BPS"
          			+ "  \u2022  " + LocalTime.now().format(DateTimeFormatter.ofPattern("HH:mm"));
          		int nw = mc.textRenderer.getWidth(name);
          		el.w = nw + mc.textRenderer.getWidth(rest) + 12; el.h = 16;
          		int x = el.px(sw), y = el.py(sh);
          		plate(ctx, x, y, el.w, el.h, t.accent);
          		ctx.drawTextWithShadow(mc.textRenderer, name, x + 6, y + 4, t.accent);
          		ctx.drawTextWithShadow(mc.textRenderer, rest, x + 6 + nw, y + 4, 0xFFFFFFFF);
          	}

          	private void coords(DrawContext ctx, MinecraftClient mc, Theme t, int sw, int sh) {
          		HudLayout.El el = HudLayout.COORDS;
          		String s = "XYZ  " + (int) mc.player.getX() + "  " + (int) mc.player.getY() + "  " + (int) mc.player.getZ();
          		el.w = mc.textRenderer.getWidth(s) + 12; el.h = 14;
          		int x = el.px(sw), y = el.py(sh);
          		plate(ctx, x, y, el.w, el.h, t.accent);
          		ctx.drawTextWithShadow(mc.textRenderer, s, x + 6, y + 3, 0xFFFFFFFF);
          	}

          	private void key(DrawContext ctx, MinecraftClient mc, Theme t, int x, int y, int bw, String s, boolean down) {
          		ctx.fill(x, y, x + bw, y + 18, down ? Theme.withAlpha(t.accent, 0xC0) : 0x80000000);
          		ctx.drawCenteredTextWithShadow(mc.textRenderer, s, x + bw / 2, y + 5, 0xFFFFFFFF);
          	}

          	private void drawKeys(DrawContext ctx, MinecraftClient mc, Theme t, int sw, int sh) {
          		HudLayout.El el = HudLayout.KEYS;
          		int x = el.px(sw), y = el.py(sh);
          		var o = mc.options;
          		key(ctx, mc, t, x + 20, y, 18, "W", o.forwardKey.isPressed());
          		key(ctx, mc, t, x, y + 20, 18, "A", o.leftKey.isPressed());
          		key(ctx, mc, t, x + 20, y + 20, 18, "S", o.backKey.isPressed());
          		key(ctx, mc, t, x + 40, y + 20, 18, "D", o.rightKey.isPressed());
          		key(ctx, mc, t, x, y + 40, 28, "LMB", o.attackKey.isPressed());
          		key(ctx, mc, t, x + 30, y + 40, 28, "RMB", o.useKey.isPressed());
          	}

          	private void drawPotions(DrawContext ctx, MinecraftClient mc, Theme t, int sw, int sh) {
          		HudLayout.El el = HudLayout.POTIONS;
          		int x = el.px(sw), y = el.py(sh), startY = y, maxW = 0, n = 0;
          		for (StatusEffectInstance e : mc.player.getStatusEffects()) {
          			if (n++ >= 6) break;
          			String name = e.getEffectType().value().getName().getString() + " " + (e.getAmplifier() + 1);
          			int s = e.getDuration() / 20;
          			String time = e.isInfinite() ? "inf" : (s / 60) + ":" + String.format("%02d", s % 60);
          			int pw = Math.max(mc.textRenderer.getWidth(name), mc.textRenderer.getWidth(time)) + 26;
          			maxW = Math.max(maxW, pw);
          			plate(ctx, x, y, pw, 22, t.accent);
          			int col = 0xFF000000 | e.getEffectType().value().getColor();
          			ctx.fill(x + 4, y + 5, x + 16, y + 17, col);
          			ctx.drawTextWithShadow(mc.textRenderer, name, x + 21, y + 3, 0xFFFFFFFF);
          			ctx.drawTextWithShadow(mc.textRenderer, time, x + 21, y + 12, 0xFFAAAAAA);
          			y += 27;
          		}
          		if (n == 0) { el.w = 90; el.h = 22; } else { el.w = maxW; el.h = y - startY - 5; }
          	}

          	private void target(DrawContext ctx, MinecraftClient mc, Theme t, int sw, int sh) {
          		HudLayout.El el = HudLayout.TARGET;
          		Entity e = Effects.lastTarget;
          		boolean live = e instanceof LivingEntity && e.isAlive() && System.currentTimeMillis() - Effects.hitTime < 4000;
          		boolean preview = mc.currentScreen instanceof HudEditorScreen;
          		if (!live && !preview) return;

          		String name = live ? e.getName().getString() : "Target";
          		float hp = 1f; int hpInt = 20;
          		if (live) {
          			LivingEntity le = (LivingEntity) e;
          			hp = Math.max(0f, Math.min(1f, le.getHealth() / le.getMaxHealth()));
          			hpInt = (int) Math.ceil(le.getHealth());
          		}
          		el.w = Math.max(110, mc.textRenderer.getWidth(name) + 36); el.h = 30;
          		int x = el.px(sw), y = el.py(sh);
          		plate(ctx, x, y, el.w, el.h, t.accent);
          		ctx.fill(x + 4, y + 5, x + 24, y + 25, Theme.withAlpha(t.accent, 0x90));
          		ctx.drawCenteredTextWithShadow(mc.textRenderer, name.substring(0, 1).toUpperCase(), x + 14, y + 11, 0xFFFFFFFF);
          		ctx.drawTextWithShadow(mc.textRenderer, name, x + 29, y + 4, 0xFFFFFFFF);
          		ctx.drawTextWithShadow(mc.textRenderer, "HP: " + hpInt, x + 29, y + 13, 0xFFAAAAAA);
          		int bw = el.w - 35;
          		ctx.fill(x + 29, y + 24, x + 29 + bw, y + 27, 0x80000000);
          		ctx.fill(x + 29, y + 24, x + 29 + (int) (bw * hp), y + 27, hp > 0.3f ? t.accent : 0xFFFF3B3B);
          	}

          	private void drawArmor(DrawContext ctx, MinecraftClient mc, Theme t, int sw, int sh) {
          		HudLayout.El el = HudLayout.ARMOR;
          		int x = el.px(sw), y = el.py(sh);
          		EquipmentSlot[] slots = {EquipmentSlot.HEAD, EquipmentSlot.CHEST, EquipmentSlot.LEGS, EquipmentSlot.FEET};
          		for (EquipmentSlot s : slots) {
          			ItemStack st = mc.player.getEquippedStack(s);
          			if (!st.isEmpty()) {
          				ctx.drawItem(st, x, y);
          				if (st.isDamageable()) {
          					float r = 1f - (float) st.getDamage() / st.getMaxDamage();
          					ctx.fill(x, y + 17, x + 16, y + 19, 0x80000000);
          					ctx.fill(x, y + 17, x + (int) (16 * r), y + 19, r > 0.3f ? t.accent : 0xFFFF3B3B);
          				}
          			}
          			y += 20;
          		}
          	}

          	/** Theme tint + frame over every screen. */
          	public static void drawScreenFrame(DrawContext ctx, int w, int h) {
          		if (!Config.screenTheme) return;
          		int a = Theme.current().accent;
          		ctx.fill(0, 0, w, h, Theme.withAlpha(a, 0x14));
          		int line = Theme.withAlpha(a, 0xB0);
          		ctx.fill(0, 0, w, 2, line);
          		ctx.fill(0, h - 2, w, h, line);
          		ctx.fill(0, 0, 2, h, line);
          		ctx.fill(w - 2, 0, w, h, line);
          	}
          }
          AV_EOF_END
          cat > p/src/main/java/dev/attackvisual/AttackVisual.java <<'AV_EOF_END'
          package dev.attackvisual;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry;
          import net.fabricmc.fabric.api.client.rendering.v1.hud.VanillaHudElements;
          import net.fabricmc.fabric.api.client.screen.v1.ScreenEvents;
          import net.fabricmc.fabric.api.event.player.AttackEntityCallback;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.util.ActionResult;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;

          public class AttackVisual implements ClientModInitializer {
          	public static final String ID = "attackvisual";
          	private boolean wasDown;

          	@Override
          	public void onInitializeClient() {
          		Config.load();

          		HudElementRegistry.attachElementAfter(VanillaHudElements.HOTBAR, Identifier.of(ID, "hud"), new AttackHud());

          		ScreenEvents.AFTER_INIT.register((client, screen, w, h) ->
          			ScreenEvents.afterRender(screen).register((s, ctx, mx, my, delta) ->
          				AttackHud.drawScreenFrame(ctx, s.width, s.height)));

          		AttackEntityCallback.EVENT.register((player, world, hand, entity, hit) -> {
          			if (world.isClient() && entity instanceof LivingEntity) Effects.onHit(entity);
          			return ActionResult.PASS;
          		});

          		ClientTickEvents.END_CLIENT_TICK.register(client -> {
          			Effects.tick(client);
          			Esp.tick(client);
          			if (client.getWindow() == null) return;
          			boolean down = GLFW.glfwGetKey(client.getWindow().getHandle(), GLFW.GLFW_KEY_RIGHT_SHIFT) == GLFW.GLFW_PRESS;
          			if (down && !wasDown && client.currentScreen == null) client.setScreen(new MenuScreen());
          			wasDown = down;
          		});
          	}
          }
          AV_EOF_END
          cat > p/src/main/java/dev/attackvisual/Config.java <<'AV_EOF_END'
          package dev.attackvisual;

          import net.fabricmc.loader.api.FabricLoader;
          import java.io.Reader;
          import java.io.Writer;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.Properties;

          /** All module switches. Saved to config/attackvisual.properties */
          public final class Config {
          	public static boolean fullBright = false;
          	public static boolean hitSound = true;
          	public static boolean hitParticles = true;
          	public static boolean hitMarker = true;
          	public static boolean jumpCircles = true;
          	public static boolean keystrokes = true;
          	public static boolean potions = true;
          	public static boolean armor = true;
          	public static boolean crosshair = true;
          	public static boolean infoPanel = true;
          	public static boolean watermark = true;
          	public static boolean targetHud = true;
          	public static boolean targetEsp = true;
          	public static int espMode = 0;
          	public static boolean chinaHat = false;
          	public static boolean trail = false;
          	public static boolean killEffect = true;
          	public static boolean zoom = true;
          	public static boolean noHurtCam = false;
          	public static boolean noNausea = false;
          	public static boolean noFovEffects = false;
          	public static boolean noBob = false;
          	public static int crosshairStyle = 0;
          	public static boolean screenTheme = true;
          	public static int soundIndex = 0;
          	public static int themeIndex = 0;

          	private static Path file() { return FabricLoader.getInstance().getConfigDir().resolve("attackvisual.properties"); }

          	public static void load() {
          		try {
          			Path f = file();
          			if (!Files.exists(f)) return;
          			Properties p = new Properties();
          			try (Reader r = Files.newBufferedReader(f)) { p.load(r); }
          			fullBright = b(p, "fullBright", fullBright);
          			hitSound = b(p, "hitSound", hitSound);
          			hitParticles = b(p, "hitParticles", hitParticles);
          			hitMarker = b(p, "hitMarker", hitMarker);
          			jumpCircles = b(p, "jumpCircles", jumpCircles);
          			keystrokes = b(p, "keystrokes", keystrokes);
          			potions = b(p, "potions", potions);
          			armor = b(p, "armor", armor);
          			crosshair = b(p, "crosshair", crosshair);
          			infoPanel = b(p, "infoPanel", infoPanel);
          			screenTheme = b(p, "screenTheme", screenTheme);
          			watermark = b(p, "watermark", watermark);
          			targetHud = b(p, "targetHud", targetHud);
          			targetEsp = b(p, "targetEsp", targetEsp);
          			chinaHat = b(p, "chinaHat", chinaHat);
          			trail = b(p, "trail", trail);
          			killEffect = b(p, "killEffect", killEffect);
          			zoom = b(p, "zoom", zoom);
          			noHurtCam = b(p, "noHurtCam", noHurtCam);
          			noNausea = b(p, "noNausea", noNausea);
          			noFovEffects = b(p, "noFovEffects", noFovEffects);
          			noBob = b(p, "noBob", noBob);
          			crosshairStyle = Math.floorMod(Integer.parseInt(p.getProperty("crosshairStyle", "0")), AttackHud.CROSSHAIRS.length);
          			espMode = Math.floorMod(Integer.parseInt(p.getProperty("espMode", "0")), Esp.MODES.length);
          			HudLayout.load(p);
          			soundIndex = Math.floorMod(Integer.parseInt(p.getProperty("soundIndex", "0")), HitSounds.NAMES.length);
          			themeIndex = Math.floorMod(Integer.parseInt(p.getProperty("themeIndex", "0")), Theme.values().length);
          		} catch (Exception ignored) {}
          	}

          	public static void save() {
          		try {
          			Properties p = new Properties();
          			p.setProperty("fullBright", String.valueOf(fullBright));
          			p.setProperty("hitSound", String.valueOf(hitSound));
          			p.setProperty("hitParticles", String.valueOf(hitParticles));
          			p.setProperty("hitMarker", String.valueOf(hitMarker));
          			p.setProperty("jumpCircles", String.valueOf(jumpCircles));
          			p.setProperty("keystrokes", String.valueOf(keystrokes));
          			p.setProperty("potions", String.valueOf(potions));
          			p.setProperty("armor", String.valueOf(armor));
          			p.setProperty("crosshair", String.valueOf(crosshair));
          			p.setProperty("infoPanel", String.valueOf(infoPanel));
          			p.setProperty("screenTheme", String.valueOf(screenTheme));
          			p.setProperty("watermark", String.valueOf(watermark));
          			p.setProperty("targetHud", String.valueOf(targetHud));
          			p.setProperty("targetEsp", String.valueOf(targetEsp));
          			p.setProperty("chinaHat", String.valueOf(chinaHat));
          			p.setProperty("trail", String.valueOf(trail));
          			p.setProperty("killEffect", String.valueOf(killEffect));
          			p.setProperty("zoom", String.valueOf(zoom));
          			p.setProperty("noHurtCam", String.valueOf(noHurtCam));
          			p.setProperty("noNausea", String.valueOf(noNausea));
          			p.setProperty("noFovEffects", String.valueOf(noFovEffects));
          			p.setProperty("noBob", String.valueOf(noBob));
          			p.setProperty("crosshairStyle", String.valueOf(crosshairStyle));
          			p.setProperty("espMode", String.valueOf(espMode));
          			HudLayout.save(p);
          			p.setProperty("soundIndex", String.valueOf(soundIndex));
          			p.setProperty("themeIndex", String.valueOf(themeIndex));
          			try (Writer w = Files.newBufferedWriter(file())) { p.store(w, "Attack Visual"); }
          		} catch (Exception ignored) {}
          	}

          	private static boolean b(Properties p, String k, boolean d) {
          		return Boolean.parseBoolean(p.getProperty(k, String.valueOf(d)));
          	}
          }
          AV_EOF_END
          cat > p/src/main/java/dev/attackvisual/Effects.java <<'AV_EOF_END'
          package dev.attackvisual;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.SimpleOption;
          import net.minecraft.entity.LivingEntity;
          import org.lwjgl.glfw.GLFW;
          import net.minecraft.client.sound.PositionedSoundInstance;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.particle.DustParticleEffect;

          /** Hit sound, hit particles, jump circles, full bright. */
          public final class Effects {
          	public static long hitTime = 0;
          	public static Entity lastTarget = null;
          	private static boolean wasOnGround = true;
          	private static boolean fbActive = false;
          	private static double savedGamma = 1.0;
          	private static boolean killHandled = true;
          	private static boolean zooming = false;
          	private static int savedFov = 70;
          	private static final Double[] tiltBox = new Double[1], distBox = new Double[1], fovFxBox = new Double[1];
          	private static final Boolean[] bobBox = new Boolean[1];
          	public static double bps = 0;
          	private static double prevX, prevZ;
          	private static boolean hasPrev = false;

          	public static void onHit(Entity target) {
          		MinecraftClient mc = MinecraftClient.getInstance();
          		hitTime = System.currentTimeMillis();
          		lastTarget = target;
          		killHandled = false;
          		if (Config.hitSound) {
          			mc.getSoundManager().play(PositionedSoundInstance.master(net.minecraft.registry.entry.RegistryEntry.of(HitSounds.EVENTS[Config.soundIndex]), 1.2f, 0.8f));
          		}
          		if (Config.hitParticles && mc.world != null) {
          			DustParticleEffect dust = new DustParticleEffect(Theme.current().accent & 0xFFFFFF, 1.0f);
          			for (int i = 0; i < 12; i++) {
          				mc.particleManager.addParticle(dust,
          					target.getX() + (Math.random() - 0.5) * 0.6,
          					target.getBodyY(0.3 + Math.random() * 0.6),
          					target.getZ() + (Math.random() - 0.5) * 0.6,
          					(Math.random() - 0.5) * 0.2, Math.random() * 0.15, (Math.random() - 0.5) * 0.2);
          			}
          		}
          	}

          	public static void tick(MinecraftClient mc) {
          		PlayerEntity p = mc.player;
          		if (p == null || mc.world == null) return;

          		// Speed (blocks per second, smoothed)
          		if (hasPrev) bps = bps * 0.8 + Math.hypot(p.getX() - prevX, p.getZ() - prevZ) * 20 * 0.2;
          		prevX = p.getX(); prevZ = p.getZ(); hasPrev = true;

          		// China hat (third person only)
          		if (Config.chinaHat && !mc.options.getPerspective().isFirstPerson() && mc.world.getTime() % 3 == 0) {
          			DustParticleEffect hat = new DustParticleEffect(Theme.current().accent & 0xFFFFFF, 0.9f);
          			double top = p.getY() + p.getHeight();
          			for (int i = 0; i < 12; i++) {
          				double a = Math.PI * 2 * i / 12 + mc.world.getTime() * 0.1;
          				mc.particleManager.addParticle(hat, p.getX() + Math.cos(a) * 0.5, top + 0.08, p.getZ() + Math.sin(a) * 0.5, 0, 0, 0);
          				mc.particleManager.addParticle(hat, p.getX() + Math.cos(a) * 0.28, top + 0.28, p.getZ() + Math.sin(a) * 0.28, 0, 0, 0);
          			}
          			mc.particleManager.addParticle(hat, p.getX(), top + 0.45, p.getZ(), 0, 0, 0);
          		}

          		// Jump circle
          		boolean onGround = p.isOnGround();
          		if (Config.jumpCircles && wasOnGround && !onGround && p.getVelocity().y > 0.1) {
          			DustParticleEffect dust = new DustParticleEffect(Theme.current().accent & 0xFFFFFF, 1.0f);
          			for (int i = 0; i < 24; i++) {
          				double a = Math.PI * 2 * i / 24;
          				mc.particleManager.addParticle(dust, p.getX() + Math.cos(a) * 0.7, p.getY() + 0.05, p.getZ() + Math.sin(a) * 0.7, 0, 0, 0);
          			}
          		}
          		wasOnGround = onGround;

          		// Trail
          		if (Config.trail && bps > 1.0) {
          			DustParticleEffect tr = new DustParticleEffect(Theme.current().accent & 0xFFFFFF, 1.1f);
          			for (int i = 0; i < 2; i++) {
          				mc.particleManager.addParticle(tr, p.getX() + (Math.random() - 0.5) * 0.4, p.getY() + 0.1 + Math.random() * 0.2, p.getZ() + (Math.random() - 0.5) * 0.4, 0, 0, 0);
          			}
          		}

          		// Kill effect: burst when the entity you hit dies
          		if (Config.killEffect && !killHandled && lastTarget instanceof LivingEntity le && !le.isAlive()
          			&& System.currentTimeMillis() - hitTime < 4000) {
          			killHandled = true;
          			DustParticleEffect k = new DustParticleEffect(Theme.current().accent & 0xFFFFFF, 1.6f);
          			for (int i = 0; i < 40; i++) {
          				double a = Math.random() * Math.PI * 2, up = Math.random() * 0.4;
          				mc.particleManager.addParticle(k, le.getX(), le.getBodyY(0.5), le.getZ(), Math.cos(a) * 0.25, up, Math.sin(a) * 0.25);
          			}
          		}

          		// Zoom: hold C
          		var fov = mc.options.getFov();
          		boolean cDown = Config.zoom && mc.currentScreen == null && mc.getWindow() != null
          			&& GLFW.glfwGetKey(mc.getWindow().getHandle(), GLFW.GLFW_KEY_C) == GLFW.GLFW_PRESS;
          		if (cDown) {
          			if (!zooming) { savedFov = fov.getValue(); zooming = true; }
          			if (fov.getValue() != 30) fov.setValue(30);
          		} else if (zooming) {
          			fov.setValue(savedFov);
          			zooming = false;
          		}

          		// Comfort removals (use vanilla options, restored when turned off)
          		holdD(mc.options.getDamageTiltStrength(), Config.noHurtCam, tiltBox);
          		holdD(mc.options.getDistortionEffectScale(), Config.noNausea, distBox);
          		holdD(mc.options.getFovEffectScale(), Config.noFovEffects, fovFxBox);
          		var bob = mc.options.getBobView();
          		if (Config.noBob) {
          			if (bobBox[0] == null) bobBox[0] = bob.getValue();
          			if (bob.getValue()) bob.setValue(false);
          		} else if (bobBox[0] != null) {
          			bob.setValue(bobBox[0]);
          			bobBox[0] = null;
          		}

          		// Full bright (max gamma, restored when turned off)
          		var gamma = mc.options.getGamma();
          		if (Config.fullBright) {
          			if (!fbActive) { savedGamma = gamma.getValue(); fbActive = true; }
          			if (gamma.getValue() < 1.0) gamma.setValue(1.0);
          		} else if (fbActive) {
          			gamma.setValue(savedGamma);
          			fbActive = false;
          		}
          	}

          	private static void holdD(SimpleOption<Double> o, boolean on, Double[] box) {
          		if (on) {
          			if (box[0] == null) box[0] = o.getValue();
          			if (o.getValue() != 0.0) o.setValue(0.0);
          		} else if (box[0] != null) {
          			o.setValue(box[0]);
          			box[0] = null;
          		}
          	}
          }
